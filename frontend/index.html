<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Radio colaborativa en vivo: crea una sala, propón canciones y voten juntos qué suena."
    />
    <meta property="og:title" content="thevibe" />
    <meta
      property="og:description"
      content="Radio colaborativa en vivo: crea una sala, propón canciones y voten juntos qué suena."
    />
    <meta property="og:type" content="website" />
    <title>thevibe · radio colaborativa</title>
    <style>
      /* Pantalla de carga en HTML plano: se ve de inmediato, sin esperar al
         JavaScript. React la reemplaza al montar la app. */
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }

      #carga {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      #carga span {
        width: 8px;
        height: 44px;
        border-radius: 99px;
        background: linear-gradient(to top, #7c3aed, #e879f9);
        animation: latido 1.2s ease-in-out infinite;
      }

      #carga span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #carga span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes latido {
        0%,
        100% {
          transform: scaleY(0.3);
        }
        50% {
          transform: scaleY(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #carga span {
          animation: none;
          transform: scaleY(0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="carga" role="status" aria-label="Cargando thevibe">
        <span></span><span></span><span></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
